name: Flutter CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter test integration_test/inference_test.dart -d macos
      - run: flutter build macos --release
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Teachable Lab.app" teachable-lab-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: teachable-lab-macos.zip
